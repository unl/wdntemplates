name: Bump DCF Version

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-DCF-version:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Compare locked DCF commit with upstream
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh api fails the step loudly on API errors (rate limits, auth, etc.)
          LATEST_SHA=$(gh api repos/digitalcampusframework/dcf/branches/4.1 --jq '.commit.sha')

          if ! [[ "$LATEST_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unexpected SHA from API: '$LATEST_SHA'"
            exit 1
          fi

          CURRENT_SHA=$(jq -r '.packages."node_modules/dcf".resolved' package-lock.json | sed 's/.*#//')
          echo "Current: $CURRENT_SHA"
          echo "Latest:  $LATEST_SHA"

          if [ "$CURRENT_SHA" != "$LATEST_SHA" ]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            echo "latest_sha=$LATEST_SHA" >> "$GITHUB_OUTPUT"
            echo "short_hash=${LATEST_SHA:0:7}" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date."
          fi

      - name: Modify package-lock.json
        if: steps.check.outputs.needs_update == 'true'
        run: |
          jq --arg url "git+ssh://git@github.com/digitalcampusframework/dcf.git#${{ steps.check.outputs.latest_sha }}" \
            '.packages."node_modules/dcf".resolved = $url' \
            package-lock.json > package-lock.tmp
          mv package-lock.tmp package-lock.json

      - name: Create pull request
        if: steps.check.outputs.needs_update == 'true'
        uses: gr2m/create-or-update-pull-request-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          title: "Bump DCF (${{ steps.check.outputs.short_hash }})"
          body: "Updated DCF commit hash"
          branch: "gw-dcf-bump-branch-${{ steps.check.outputs.short_hash }}"
          commit-message: "Bumped DCF"
          labels: dependency
          reviewers: tommyneu, skoolbus39
          auto-merge: squash
          update-pull-request-title-and-body: false